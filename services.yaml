# Registry of upstream services proxied by nib_proxy.
# Add new services here without touching any code.
#
# Fields:
#   name:        unique identifier for this service
#   path_prefix: path prefix on the proxy that routes to this service
#   upstream:    base URL of the upstream service

- name: wms-ortofoto
  path_prefix: /wms/ortofoto
  upstream: https://services.norgeibilder.no/arcgis/services/ortofoto/ImageServer/WMSServer

- name: wms-prosjekter
  path_prefix: /wms/prosjekter
  upstream: https://services.norgeibilder.no/arcgis/services/ortofoto_prosjekter/ImageServer/WMSServer

- name: wms-mosaikk
  path_prefix: /wms/mosaikk
  upstream: https://services.norgeibilder.no/arcgis/services/prosjekter/ImageServer/WMSServer

- name: wmts-utm32
  path_prefix: /wmts/utm32_euref89
  upstream: https://tilecache.norgeibilder.no/arcgis/rest/services/Nibcache_UTM32_EUREF89_v2/MapServer/WMTS


- name: wmts-utm33
  path_prefix: /wmts/utm33_euref89
  upstream: https://tilecache.norgeibilder.no/arcgis/rest/services/Nibcache_UTM33_EUREF89_v2/MapServer/WMTS


- name: wmts-utm35
  path_prefix: /wmts/utm35_euref89
